# main에 merge되면(또는 Actions 화면에서 수동 실행) 테스트 → 이미지 3개 빌드·GHCR push → 인스턴스 B, A 순서로 배포.
# 서버에는 SSH 접속만 하고, 비밀값은 각 서버의 ~/roampass/.env에 둠(decisions #105)
#
# 필요한 저장소 secrets
#   DEPLOY_SSH_KEY         두 인스턴스에 등록한 배포용 개인키
#   DEPLOY_USER            인스턴스 로그인 사용자(예: ubuntu)
#   INSTANCE_A_HOST        인스턴스 A 공인 IP
#   INSTANCE_B_PRIVATE_IP  인스턴스 B 사설 IP(공인 SSH를 열지 않고 A를 거쳐 접속)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon

  images:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [roampass-api, mock-pg, mock-supplier]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (GHCR needs a lower-case owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.module }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USER_AT_A: ${{ secrets.DEPLOY_USER }}@${{ secrets.INSTANCE_A_HOST }}
      USER_AT_B: ${{ secrets.DEPLOY_USER }}@${{ secrets.INSTANCE_B_PRIVATE_IP }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}   # 스크립트에 직접 넣지 않고 환경변수로 전달
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.INSTANCE_A_HOST }}" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          Host ${{ secrets.INSTANCE_B_PRIVATE_IP }}
            ProxyJump ${USER_AT_A}
          CONFIG
      # B를 먼저: A의 새 api가 뜨기 전에 결제·발급 상대가 준비되어 있도록
      - name: Deploy instance B (mock-pg, mock-supplier)
        run: |
          scp deploy/instance-b/compose.yaml "$USER_AT_B:roampass/compose.yaml"
          ssh "$USER_AT_B" "cd roampass && IMAGE_TAG=$TAG docker compose pull && IMAGE_TAG=$TAG docker compose up -d --remove-orphans"
      - name: Deploy instance A (roampass-api, postgres)
        run: |
          scp deploy/instance-a/compose.yaml "$USER_AT_A:roampass/compose.yaml"
          ssh "$USER_AT_A" "cd roampass && IMAGE_TAG=$TAG docker compose pull && IMAGE_TAG=$TAG docker compose up -d --remove-orphans"
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if ssh "$USER_AT_A" "curl -fsS localhost:8080/actuator/health" && \
               ssh "$USER_AT_B" "curl -fsS localhost:8081/actuator/health && curl -fsS localhost:8082/actuator/health"; then
              echo; echo "all healthy"; exit 0
            fi
            sleep 10
          done
          echo "health check failed"; exit 1

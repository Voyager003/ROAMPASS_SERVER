# 로컬 개발·확인 전용. 접속 정보는 .env(gitignore 대상)에서 읽으므로 .env.example을 .env로 먼저 복사
#   docker compose up -d                          → postgres만 (IDE·bootRun으로 앱을 띄울 때)
#   docker compose --profile app up -d --build    → postgres + roampass-api + mock-pg + mock-supplier
#   docker compose --profile app down             → 전부 종료
# 컨테이너끼리는 서비스 이름(postgres, roampass-api, mock-pg, mock-supplier)으로 접속.
# 호스트 포트는 bootRun과 같아서(8080·8081·8082) 프론트·curl 명령을 그대로 쓸 수 있음. 둘을 동시에 띄우지 말 것
services:
  postgres:
    image: 'postgres:17'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?.env가 필요합니다(cp .env.example .env)}
      POSTGRES_USER: ${POSTGRES_USER:?.env가 필요합니다(cp .env.example .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env가 필요합니다(cp .env.example .env)}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20

  roampass-api:
    profiles: [app]
    build:
      context: .
      args:
        MODULE: roampass-api
    image: roampass-api
    environment:
      SPRING_PROFILES_ACTIVE: prod   # application-prod.yml: DB 접속 정보는 환경변수로만
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_BASE_URL: http://mock-pg:8081
      SUPPLIER_BASE_URL: http://mock-supplier:8082
      # 서명 비밀키(PG_WEBHOOK_SECRET, SUPPLIER_CALLBACK_SECRET)는 세 앱의 로컬 기본값이 같아 생략
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  mock-pg:
    profiles: [app]
    build:
      context: .
      args:
        MODULE: mock-pg
    image: mock-pg
    environment:
      PG_WEBHOOK_URL: http://roampass-api:8080/api/payments/webhook
    ports:
      - '8081:8081'

  mock-supplier:
    profiles: [app]
    build:
      context: .
      args:
        MODULE: mock-supplier
    image: mock-supplier
    environment:
      SUPPLIER_CALLBACK_URL: http://roampass-api:8080/api/issuance/callback
    ports:
      - '8082:8082'

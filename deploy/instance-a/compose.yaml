# 인스턴스 A(공개): roampass-api + postgres. GitHub Actions(deploy.yml)가 이 파일을 ~/roampass/에 복사하고
#   IMAGE_TAG=<커밋 SHA> docker compose pull && docker compose up -d
# 로 갱신함. 비밀값·주소는 같은 폴더의 .env(서버에서 한 번 직접 작성, .env.example 참고)에서 읽음
services:
  postgres:
    image: 'postgres:17'
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?.env 필요}
      POSTGRES_USER: ${POSTGRES_USER:?.env 필요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 필요}
    volumes:
      - pgdata:/var/lib/postgresql/data   # 컨테이너를 다시 만들어도 데이터 유지
    # 포트를 밖에 열지 않음: api 컨테이너만 같은 compose 네트워크로 접속
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  roampass-api:
    image: ghcr.io/${IMAGE_OWNER:?.env 필요}/roampass-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # 인스턴스 B의 사설 IP (VCN 내부 통신)
      PG_BASE_URL: http://${INSTANCE_B_PRIVATE_IP:?.env 필요}:8081
      SUPPLIER_BASE_URL: http://${INSTANCE_B_PRIVATE_IP}:8082
      # 인스턴스 B와 같은 값이어야 서명 검증이 통과함
      PG_WEBHOOK_SECRET: ${PG_WEBHOOK_SECRET:?.env 필요}
      SUPPLIER_CALLBACK_SECRET: ${SUPPLIER_CALLBACK_SECRET:?.env 필요}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # 1GB 인스턴스에서 postgres와 함께 돌도록 힙 상한을 명시
      JAVA_OPTS: -Xms128m -Xmx384m
    ports:
      - '8080:8080'   # 공개: 프론트(Vercel 서버)가 호출, 인스턴스 B가 웹훅·콜백을 보냄
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

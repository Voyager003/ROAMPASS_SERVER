# 공통 설정. 민감하지 않은 값만 — 이 파일은 커밋 대상
# 민감한 값은 application-local.yml(gitignore 대상)이나 환경변수(운영)에 보관
spring:
  application:
    name: roampass-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리, Hibernate는 검증만
    properties:
      hibernate:
        jdbc:
          time_zone: UTC   # 시각은 UTC로 저장·조회, KST 변환은 계산·표시할 때만
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080

roampass:
  scheduling:
    enabled: true              # 스케줄러 전체 on/off
  order:
    payment-window: 10m        # 주문 생성 후 결제 대기 시간
    expiration:
      batch-size: 100          # 만료 스케줄러 1회 최대 처리 건수
      fixed-delay: PT30S       # 만료 스케줄러 실행 간격(ISO-8601, 이전 실행 종료 기준)
  pg:
    base-url: ${PG_BASE_URL:http://localhost:8081}   # mock-pg 주소
    connect-timeout: 2s
    read-timeout: 5s           # 넘으면 결과 UNKNOWN, 결제는 REQUESTED로 남고 웹훅·상태 조회로 확정
    # 로컬 개발용 기본값. 배포 환경은 PG_WEBHOOK_SECRET 환경변수로 교체(mock-pg와 같은 값)
    webhook-secret: ${PG_WEBHOOK_SECRET:local-dev-webhook-secret}
    reconciliation:
      stale-after: 1m          # 요청 후 1분 지난 REQUESTED만 PG에 조회(읽기 타임아웃 5초보다 길게)
      batch-size: 50           # 1회 최대 조회 건수
      fixed-delay: PT30S       # 실행 간격(ISO-8601, 이전 실행 종료 기준)
    refund:
      max-attempts: 3          # PG 취소 최대 시도 횟수, 모두 실패하면 NEEDS_ATTENTION(운영자 확인)
      base-delay: 1m           # 첫 실패 후 대기, 이후 2배(1분 → 2분)
      max-delay: 30m
      batch-size: 50
      fixed-delay: PT15S       # 환불 실행 스케줄러 간격
  issuance:
    # 로컬 개발용 기본값. 배포 환경은 SUPPLIER_CALLBACK_SECRET 환경변수로 교체(mock-supplier와 같은 값)
    callback-secret: ${SUPPLIER_CALLBACK_SECRET:local-dev-callback-secret}
    callback-timeout: 2m       # 발급 요청 후 이 시간 안에 콜백이 없으면 ISSUE_FAILED → 자동 환불
    batch-size: 50

# 공통 설정. 민감하지 않은 값만 — 이 파일은 커밋 대상
# 민감한 값은 application-local.yml(gitignore 대상)이나 환경변수(운영)에 보관
spring:
  application:
    name: roampass-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리, Hibernate는 검증만
    properties:
      hibernate:
        jdbc:
          time_zone: UTC   # 시각은 UTC로 저장·조회, KST 변환은 계산·표시할 때만
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080

roampass:
  scheduling:
    enabled: true              # 스케줄러 전체 on/off
  order:
    payment-window: 10m        # 주문 생성 후 결제 대기 시간
    expiration:
      batch-size: 100          # 만료 스케줄러 1회 최대 처리 건수
      fixed-delay: PT30S       # 만료 스케줄러 실행 간격(ISO-8601, 이전 실행 종료 기준)
  pg:
    base-url: ${PG_BASE_URL:http://localhost:8081}   # mock-pg 주소
    connect-timeout: 2s
    read-timeout: 5s           # 넘으면 결과 UNKNOWN, 결제는 REQUESTED로 남고 웹훅·상태 조회로 확정
    # 로컬 개발용 기본값. 배포 환경은 PG_WEBHOOK_SECRET 환경변수로 교체(mock-pg와 같은 값)
    webhook-secret: ${PG_WEBHOOK_SECRET:local-dev-webhook-secret}
